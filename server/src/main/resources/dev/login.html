<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>로그인 · ONE AI</title>
<style>
  :root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#17212f;background:#f4f6f9}*{box-sizing:border-box}body{margin:0}.card{width:min(100% - 32px,460px);margin:8vh auto;padding:24px;border:1px solid #d9e0e8;border-radius:12px;background:#fff}h1{margin-top:0;font-size:1.6rem}p{color:#536174;line-height:1.55}label{display:block;margin:16px 0 6px;font-weight:700}input{width:100%;min-height:44px;padding:10px 12px;border:1px solid #bdc8d5;border-radius:7px;font:inherit}.remember{display:flex;align-items:center;gap:8px;margin:12px 0 0;font-weight:600}.remember input{width:auto;min-height:0;margin:0}.remember-hint{margin:4px 0 0;font-size:.85rem}button,a{min-height:44px}button{width:100%;margin-top:18px;padding:0 14px;border:0;border-radius:7px;background:#234c7b;color:#fff;font:inherit;font-weight:700;cursor:pointer}a{display:inline-flex;align-items:center;color:#244c7c}#status{min-height:1.5em;color:#a32929} :focus-visible{outline:3px solid #8bb7eb;outline-offset:2px}
</style></head><body><main class="card"><h1>로그인</h1><p>매뉴얼 관리 기능은 ADMIN 계정만 사용할 수 있습니다. 기존 매뉴얼 열람은 로그인 없이 이용할 수 있습니다.</p><form id="form"><label for="loginId">아이디</label><input id="loginId" name="loginId" autocomplete="username" maxlength="32" required><label for="password">비밀번호</label><input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required><label class="remember" for="rememberLoginId"><input id="rememberLoginId" type="checkbox">아이디 저장</label><p class="remember-hint">이 브라우저에 아이디만 저장합니다. 비밀번호는 저장하지 않습니다.</p><button type="submit">로그인</button></form><p id="status" role="status" aria-live="polite"></p><a id="registerLink" href="/register">일반 회원가입</a> · <a href="/">매뉴얼로 돌아가기</a></main>
<script>
'use strict';
const form=document.getElementById('form'),status=document.getElementById('status');
const loginIdInput=form.elements.loginId,rememberLoginId=document.getElementById('rememberLoginId');
const rememberedIdKey='oneai.rememberedLoginId';
try{const rememberedId=localStorage.getItem(rememberedIdKey);if(rememberedId&&/^[A-Za-z0-9._-]{3,32}$/.test(rememberedId)){loginIdInput.value=rememberedId;rememberLoginId.checked=true;}else if(rememberedId)localStorage.removeItem(rememberedIdKey);}catch(_){}
rememberLoginId.addEventListener('change',()=>{if(!rememberLoginId.checked){try{localStorage.removeItem(rememberedIdKey);}catch(_){}}});
const returnTo=new URLSearchParams(location.search).get('return')||'/';
const safeReturn=returnTo.startsWith('/dev/')&&!returnTo.startsWith('//')&&!returnTo.includes('\\')?returnTo:'/';
document.getElementById('registerLink').href=`/register?return=${encodeURIComponent(safeReturn)}`;
if(new URLSearchParams(location.search).get('registered')==='1')status.textContent='일반 회원가입이 완료되었습니다. 로그인해 주세요.';
let csrfToken='';
async function init(){try{const response=await fetch('/api/v1/auth/csrf',{cache:'no-store',credentials:'same-origin'});if(!response.ok)throw new Error();csrfToken=(await response.json()).csrfToken;}catch(_){status.textContent='로그인 준비에 실패했습니다. 로컬 서버 상태를 확인해 주세요.';}}
form.addEventListener('submit',async event=>{event.preventDefault();if(!csrfToken){await init();if(!csrfToken)return;}const submit=form.querySelector('button');submit.disabled=true;status.textContent='로그인 중입니다.';try{const response=await fetch('/api/v1/auth/login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRF-TOKEN':csrfToken},body:JSON.stringify({loginId:loginIdInput.value,password:form.elements.password.value,returnTo:safeReturn})});const body=await response.json().catch(()=>({}));if(!response.ok){status.textContent=response.status===429?'로그인 시도가 제한되었습니다. 잠시 뒤 다시 시도해 주세요.':'아이디 또는 비밀번호를 확인해 주세요.';return;}try{if(rememberLoginId.checked)localStorage.setItem(rememberedIdKey,loginIdInput.value.trim());else localStorage.removeItem(rememberedIdKey);}catch(_){}location.assign(body.memberType==='ADMIN'?(body.returnTo||'/'):'/');}catch(_){status.textContent='로그인 요청에 실패했습니다. 잠시 뒤 다시 시도해 주세요.';}finally{submit.disabled=false;}});
init();
</script></body></html>
