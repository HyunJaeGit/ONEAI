<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>일반 회원가입 · ONE AI</title>
<style>
  :root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#242424;background:#fff}*{box-sizing:border-box}body{margin:0;background:#fff}.card{width:min(100% - 32px,460px);margin:8vh auto;padding:28px;border:1px solid #e3e1d8;border-top:5px solid #fee500;border-radius:14px;background:#fff;box-shadow:0 12px 34px rgb(25 25 25 / 8%)}h1{margin-top:0;color:#191919;font-size:1.6rem}p{color:#64666b;line-height:1.6}label{display:block;margin:16px 0 6px;color:#242424;font-weight:700}input{width:100%;min-height:44px;padding:10px 12px;border:1px solid #cbc9c0;border-radius:8px;font:inherit}button,a{min-height:44px}button{width:100%;margin-top:18px;padding:0 14px;border:1px solid #e0c900;border-radius:8px;background:#fee500;color:#191919;font:inherit;font-weight:750;cursor:pointer}button:hover{background:#f2d900}a{display:inline-flex;align-items:center;color:#242424;text-decoration-color:#d7bd00;text-underline-offset:3px}#status{min-height:1.5em;color:#b42318} :focus-visible{outline:3px solid #191919;outline-offset:3px;box-shadow:0 0 0 6px #fee500}
</style></head><body><main class="card"><h1>일반 회원가입</h1><form id="form"><label for="loginId">아이디</label><input id="loginId" name="loginId" autocomplete="username" minlength="3" maxlength="32" pattern="[A-Za-z0-9._-]+" title="영문, 숫자, 마침표, 밑줄, 하이픈을 사용할 수 있습니다." required><label for="password">PIN 번호</label><input id="password" name="password" type="password" autocomplete="new-password" inputmode="numeric" pattern="[0-9]{4}" minlength="4" maxlength="4" title="숫자 4자리 PIN" required><button type="submit">가입하기</button></form><p id="status" role="status" aria-live="polite"></p><a id="loginLink" href="/login">로그인</a> · <a href="/">매뉴얼로 돌아가기</a></main>
<script>
'use strict';
const form=document.getElementById('form'),status=document.getElementById('status');let csrfToken='';
const returnTo=new URLSearchParams(location.search).get('return')||'/';const safeReturn=returnTo.startsWith('/dev/')&&!returnTo.startsWith('//')&&!returnTo.includes('\\')?returnTo:'/';document.getElementById('loginLink').href=`/login?return=${encodeURIComponent(safeReturn)}`;
async function init(){try{const response=await fetch('/api/v1/auth/csrf',{cache:'no-store',credentials:'same-origin'});if(!response.ok)throw new Error();csrfToken=(await response.json()).csrfToken;}catch(_){status.textContent='회원가입 준비에 실패했습니다. 로컬 서버 상태를 확인해 주세요.';}}
form.addEventListener('submit',async event=>{event.preventDefault();if(!csrfToken){await init();if(!csrfToken)return;}const submit=form.querySelector('button');submit.disabled=true;status.textContent='계정을 등록하고 있습니다.';try{const response=await fetch('/api/v1/auth/register',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRF-TOKEN':csrfToken},body:JSON.stringify({loginId:form.elements.loginId.value,password:form.elements.password.value})});const body=await response.json().catch(()=>({}));if(!response.ok){status.textContent=body.error?.code==='LOGIN_ID_UNAVAILABLE'?'이미 사용할 수 없는 아이디입니다.':body.error?.code==='INVALID_PIN'?'PIN은 숫자 4자리여야 합니다.':'아이디와 입력값을 확인해 주세요.';return;}location.assign(`/login?return=${encodeURIComponent(safeReturn)}&registered=1`);}catch(_){status.textContent='가입 요청에 실패했습니다. 잠시 뒤 다시 시도해 주세요.';}finally{submit.disabled=false;}});
init();
</script></body></html>
