<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>일반 회원가입 · ONE AI</title>
<style>
  :root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#17212f;background:#f4f6f9}*{box-sizing:border-box}body{margin:0}.card{width:min(100% - 32px,460px);margin:8vh auto;padding:24px;border:1px solid #d9e0e8;border-radius:12px;background:#fff}h1{margin-top:0;font-size:1.6rem}p{color:#536174;line-height:1.55}label{display:block;margin:16px 0 6px;font-weight:700}input{width:100%;min-height:44px;padding:10px 12px;border:1px solid #bdc8d5;border-radius:7px;font:inherit}button,a{min-height:44px}button{width:100%;margin-top:18px;padding:0 14px;border:0;border-radius:7px;background:#234c7b;color:#fff;font:inherit;font-weight:700;cursor:pointer}a{display:inline-flex;align-items:center;color:#244c7c}#status{min-height:1.5em;color:#a32929} :focus-visible{outline:3px solid #8bb7eb;outline-offset:2px}
</style></head><body><main class="card"><h1>일반 회원가입</h1><p>가입 계정은 항상 USER 유형으로 생성됩니다. 회원 유형 선택은 제공하지 않습니다.</p><form id="form"><label for="loginId">아이디</label><input id="loginId" name="loginId" autocomplete="username" minlength="3" maxlength="32" pattern="[A-Za-z0-9._-]+" required aria-describedby="loginHint"><small id="loginHint">영문, 숫자, 마침표, 밑줄, 하이픈을 사용할 수 있습니다.</small><label for="password">비밀번호</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required><button type="submit">가입하기</button></form><p id="status" role="status" aria-live="polite"></p><a id="loginLink" href="/login">로그인</a> · <a href="/">매뉴얼로 돌아가기</a></main>
<script>
'use strict';
const form=document.getElementById('form'),status=document.getElementById('status');let csrfToken='';
const returnTo=new URLSearchParams(location.search).get('return')||'/';const safeReturn=returnTo.startsWith('/dev/')&&!returnTo.startsWith('//')&&!returnTo.includes('\\')?returnTo:'/';document.getElementById('loginLink').href=`/login?return=${encodeURIComponent(safeReturn)}`;
async function init(){try{const response=await fetch('/api/v1/auth/csrf',{cache:'no-store',credentials:'same-origin'});if(!response.ok)throw new Error();csrfToken=(await response.json()).csrfToken;}catch(_){status.textContent='회원가입 준비에 실패했습니다. 로컬 서버 상태를 확인해 주세요.';}}
form.addEventListener('submit',async event=>{event.preventDefault();if(!csrfToken){await init();if(!csrfToken)return;}const submit=form.querySelector('button');submit.disabled=true;status.textContent='계정을 등록하고 있습니다.';try{const response=await fetch('/api/v1/auth/register',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRF-TOKEN':csrfToken},body:JSON.stringify({loginId:form.elements.loginId.value,password:form.elements.password.value})});const body=await response.json().catch(()=>({}));if(!response.ok){status.textContent=body.error?.code==='LOGIN_ID_UNAVAILABLE'?'이미 사용할 수 없는 아이디입니다.':body.error?.code==='INVALID_PASSWORD'?'비밀번호는 8자 이상 128자 이하여야 합니다.':'아이디와 입력값을 확인해 주세요.';return;}location.assign(`/login?return=${encodeURIComponent(safeReturn)}&registered=1`);}catch(_){status.textContent='가입 요청에 실패했습니다. 잠시 뒤 다시 시도해 주세요.';}finally{submit.disabled=false;}});
init();
</script></body></html>
